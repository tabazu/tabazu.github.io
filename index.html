@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1d1a;--fg:#d9cfc4;--board:#4a423b;--cell:rgba(255,255,255,.07);--btn:#a58b72;--btnfg:#1f1d1a;--boxfg:#f3ece4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1d1a;--fg:#d9cfc4;--board:#4a423b;--cell:rgba(255,255,255,.07);--btn:#a58b72;--btnfg:#1f1d1a;--boxfg:#f3ece4;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Clear Sans","Helvetica Neue",Arial,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.top{width:min(92vw,440px);display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:clamp(22px,6.4vw,38px);font-weight:800;white-space:nowrap}
.box{background:var(--board);color:var(--boxfg);border-radius:4px;padding:6px 14px;text-align:center;min-width:56px;font-size:20px;font-weight:700}
.box small{display:block;font-size:12px;font-weight:600;opacity:.85}
.bar{width:min(92vw,440px);display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar p{margin:0;font-size:15px;line-height:1.4}
button{font:inherit;font-weight:700;background:var(--btn);color:var(--btnfg);border:0;border-radius:4px;padding:10px 16px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.board{position:relative;width:min(92vw,440px);aspect-ratio:1;background:var(--board);border-radius:8px}
.cells,.grid{position:absolute;inset:0}
.cells{display:grid;grid-template:repeat(4,1fr)/repeat(4,1fr)}
.cells i{margin:6px;background:var(--cell);border-radius:4px}
.tile{position:absolute;left:0;top:0;width:25%;height:25%;padding:6px;box-sizing:border-box;transform:translate(calc(var(--x)*100%),calc(var(--y)*100%));transition:transform .12s ease-in-out,padding .3s;cursor:pointer}
.in{position:relative;width:100%;height:100%;border-radius:4px;background:var(--img) no-repeat;background-size:400% 400%}.num{position:absolute;left:5px;top:3px;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);display:none}.nums .num{display:block}.thumb{width:56px;height:56px;border-radius:6px;background:var(--img) center/cover;flex:none}.done .tile{padding:0}.done .in{border-radius:0}.board{overflow:hidden}.btns{display:flex;flex-direction:column;gap:6px}
.msg{position:absolute;left:0;right:0;bottom:0;padding:10px;background:rgba(250,248,239,.92);display:none;align-items:center;justify-content:center;gap:12px;z-index:5;color:#776e65;text-align:center}
.msg.on{display:flex}
.msg b{font-size:22px}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<div class="top">
  <h1>슬라이딩 퍼즐</h1>
  <div class="box"><small>이동</small><span id="mv">0</span></div>
  <div class="box"><small>시간</small><span id="tm">0:00</span></div>
</div>
<div class="bar">
  <div class="thumb" title="완성 그림"></div>
  <p style="font-size:14px">타일을 탭하거나 화면 어디서든 밀어서 그림을 맞추세요.</p>
  <div class="btns"><button id="ng">새 게임</button><button id="nb">번호</button></div>
</div>
<div class="board" id="board">
  <div class="cells"></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"><b>완성!</b><span id="res"></span><button id="again">다시 하기</button></div>
</div>
<script>
(function(){
var C=['#eee4da','#ede0c8','#f2b179','#f59563','#f67c5f','#f65e3b','#edcf72','#edcc61','#edc850','#edc53f','#edc22e','#e9b21f','#d99a1c','#5c5446','#3c3a32'];
var a,moves,t0,timer,won,sw=0,sx=null,sy=null,tiles={};
var grid=document.getElementById('grid'),cells=document.querySelector('.cells');
for(var i=0;i<16;i++)cells.appendChild(document.createElement('i'));
function best(v){try{if(v!=null)localStorage.setItem('slide-best',v);return +localStorage.getItem('slide-best')||0}catch(e){return 0}}
for(let n=1;n<17;n++){
  var t=document.createElement('div');t.className='tile';
  var d=document.createElement('div');d.className='in';
  d.style.backgroundPosition=(((n-1)%4)*100/3)+'% '+(((n-1)>>2)*100/3)+'%';
  d.innerHTML='<span class="num">'+n+'</span>';if(n===16)t.style.display='none';
  t.appendChild(d);t.onclick=function(){if(Date.now()-sw<400)return;slideTo(a.indexOf(n))};
  grid.appendChild(t);tiles[n]=t;
}
function render(){
  a.forEach(function(v,i){if(v){tiles[v].style.setProperty('--x',i%4);tiles[v].style.setProperty('--y',i>>2)}});
  document.getElementById('mv').textContent=moves;
}
function fmt(s){return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function tick(){if(t0&&!won)document.getElementById('tm').textContent=fmt(Math.floor((Date.now()-t0)/1000))}
function slideTo(i){
  if(won||i<0)return false;
  var b=a.indexOf(0),bx=b%4,by=b>>2,x=i%4,y=i>>2;
  if(i===b||(x!==bx&&y!==by))return false;
  var dx=Math.sign(bx-x),dy=Math.sign(by-y),p=b,q;
  while(p!==i){q=p-(dx+dy*4);a[p]=a[q];p=q}
  a[i]=0;moves++;
  if(!t0)t0=Date.now();
  render();
  if(a.every(function(v,k){return k===15?v===0:v===k+1}))win();
  return true;
}
function dir(dx,dy){
  var b=a.indexOf(0),x=b%4-dx,y=(b>>2)-dy;
  if(x<0||x>3||y<0||y>3)return;
  slideTo(y*4+x);
}
function win(){
  won=true;tiles[16].style.setProperty('--x',3);tiles[16].style.setProperty('--y',3);tiles[16].style.display='';
  document.getElementById('board').classList.add('done');
  var s=Math.floor((Date.now()-t0)/1000),bm=best(),txt=moves+'번 · '+fmt(s);
  if(!bm||moves<bm){best(moves);txt+=' (최소 기록)'}else txt+=' (최소 '+bm+'번)';
  document.getElementById('res').textContent=txt;
  document.getElementById('msg').classList.add('on');
}
function newGame(){
  a=[];for(var i=1;i<16;i++)a.push(i);a.push(0);
  var b=15,prev=-1,k=0;
  while(k<200||a.every(function(v,j){return j===15?v===0:v===j+1})){
    var nb=[],x=b%4,y=b>>2;
    if(x>0)nb.push(b-1);if(x<3)nb.push(b+1);if(y>0)nb.push(b-4);if(y<3)nb.push(b+4);
    nb=nb.filter(function(n){return n!==prev});
    var n=nb[Math.floor(Math.random()*nb.length)];
    a[b]=a[n];a[n]=0;prev=b;b=n;k++;
  }
  moves=0;t0=0;won=false;tiles[16].style.display='none';document.getElementById('board').classList.remove('done');
  document.getElementById('tm').textContent='0:00';
  document.getElementById('msg').classList.remove('on');
  render();
}
document.getElementById('ng').onclick=newGame;
document.getElementById('nb').onclick=function(){document.body.classList.toggle('nums')};
document.getElementById('again').onclick=newGame;
timer=setInterval(tick,500);
addEventListener('keydown',function(e){
  var m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(m){e.preventDefault();dir(m[0],m[1])}
});
addEventListener('touchstart',function(e){
  if(e.touches.length>1){sx=null;return}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;
},{passive:true});
addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
addEventListener('touchend',function(e){
  if(sx==null)return;
  var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  sw=Date.now();
  if(Math.abs(dx)>Math.abs(dy))dir(Math.sign(dx),0);else dir(0,Math.sign(dy));
});
newGame();
})();
</script>
</body>
</html>
